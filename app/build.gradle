apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'
apply plugin: 'kotlin-kapt'
apply plugin: 'com.google.gms.google-services'
//apply plugin: 'com.google.firebase.crashlytics'

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.hastaprimasolusi.rana"
        minSdkVersion 19
        targetSdkVersion 33
        versionCode 1
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        vectorDrawables.useSupportLibrary = true
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    buildTypes {
        buildTypes.each {
//            it.buildConfigField("String", "BASE_URL", "\"http://remoteonly.dmlt-mob-online.com:8095/v1/api/\"")
//            it.buildConfigField("String", "BASE_URL", "\"https://app.dmlt-mob-online.com/v1/api/\"")
//            it.buildConfigField("String","BASE_URL", "\"https://sol.dmlt-mob-online.com/v1/api/\"")
//            it.buildConfigField("String","BASE_URL", "\"https://sol24.dmlt-mob-online.com/v1/api/\"")
            it.buildConfigField("String","BASE_URL", "\"https://apidsoritelprod.hastaprimasolusi.com/v1/api/\"")
            it.buildConfigField("String", "APIKEY", "\"AIzaSyDPhLfz-VsorR05RQ5Hss41-RHiFn23-KM\"")
        }
        release {
            minifyEnabled true
//            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }
}
androidExtensions {
    experimental = true
}
dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation"org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.core:core-ktx:1.3.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.0.1'
    testImplementation 'junit:junit:4.12'
    androidTestImplementation 'androidx.test.ext:junit:1.1.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.1.1'


    implementation 'androidx.vectordrawable:vectordrawable:1.1.0'
    implementation 'androidx.multidex:multidex:2.0.0'
    implementation 'androidx.recyclerview:recyclerview:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0-alpha01'

    implementation 'com.google.firebase:firebase-messaging:20.2.0'
    implementation 'com.google.firebase:firebase-core:17.4.3'
//    implementation 'com.google.firebase:firebase-analytics:17.5.0'
//    implementation 'com.google.firebase:firebase-crashlytics:17.2.1'
    implementation 'com.google.android.gms:play-services-location:17.0.0'
    implementation 'com.google.android.libraries.places:places:2.4.0'

    //anko
    implementation "org.jetbrains.anko:anko:$anko_version"
    implementation "org.jetbrains.anko:anko-commons:$anko_version"
    implementation "org.jetbrains.anko:anko-appcompat-v7:$anko_version"
    implementation "org.jetbrains.anko:anko-design:$anko_version"
    implementation "org.jetbrains.anko:anko-sqlite:$anko_version"

    //room
    implementation 'androidx.lifecycle:lifecycle-extensions:2.2.0'
    implementation "androidx.room:room-runtime:$room_version"
    kapt "androidx.room:room-compiler:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.legacy:legacy-support-v4:1.0.0"

    //viewmodel
    implementation "androidx.lifecycle:lifecycle-extensions:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    kapt "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"

    //kotlin coroutine
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.3.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.3.0'

    //retrofit
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.retrofit2:adapter-rxjava2:$retrofit_version"
    implementation 'com.jakewharton.retrofit:retrofit2-kotlin-coroutines-adapter:0.9.2'

    //koin
    implementation "org.koin:koin-androidx-viewmodel:$koin_version"

    //glide
    implementation 'com.github.bumptech.glide:glide:4.8.0'
    kapt 'com.github.bumptech.glide:compiler:4.8.0'

    //new material
    implementation "com.google.android.material:material:1.2.0-alpha06"
    implementation 'com.jaredrummler:material-spinner:1.3.1'
    implementation 'com.romandanylyk:pageindicatorview:1.0.3'

    //gson
    implementation 'com.google.code.gson:gson:2.8.5'

    //chart
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    //hawk
    implementation "com.orhanobut:hawk:2.0.1"

    //permission
    implementation 'com.karumi:dexter:6.1.0'

    //QR
    implementation 'com.google.zxing:core:3.3.0'
    implementation "com.journeyapps:zxing-android-embedded:3.2.0@aar"

    //slider
    implementation 'com.github.smarteist:autoimageslider:1.4.0-appcompat'

    implementation 'id.zelory:compressor:3.0.0'

    implementation 'com.intuit.ssp:ssp-android:1.0.6'
    implementation 'com.intuit.sdp:sdp-android:1.0.6'
    debugImplementation 'com.readystatesoftware.chuck:library:1.1.0'
    releaseImplementation 'com.readystatesoftware.chuck:library-no-op:1.1.0'
    implementation 'androidx.work:work-runtime-ktx:2.7.1'
    implementation("com.squareup.okhttp3:logging-interceptor:4.11.0")

    //camera
    implementation 'androidx.camera:camera-core:1.2.0'
    implementation("androidx.camera:camera-camera2:1.2.0")
    implementation 'androidx.camera:camera-lifecycle:1.2.0'
    implementation 'androidx.camera:camera-view:1.2.0'
    // The following line is optional, as the core library is included indirectly by camera-camera2
//    implementation("androidx.camera:camera-core:1.5.0-alpha05")
//    implementation("androidx.camera:camera-camera2:1.5.0-alpha05")
//    implementation("androidx.camera:camera-lifecycle:1.5.0-alpha05")
//    implementation("androidx.camera:camera-view:1.5.0-alpha05")

    implementation 'com.google.mlkit:face-detection:16.1.5' // ML Kit Face Detection
    implementation 'androidx.biometric:biometric:1.1.0'  // biometric auth

    implementation "androidx.activity:activity-ktx:1.6.1" // Wajib untuk registerForActivityResult

}

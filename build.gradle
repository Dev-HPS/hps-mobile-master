// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '1.6.10'
    ext.room_version = "2.4.2"
    ext.navigation_version = "1.0.0-alpha08"
    ext.lifecycle_version = "2.1.0"
    ext.retrofit_version = "2.5.0"
    ext.anko_version = '0.10.8'
    ext.koin_version = '2.1.5'
    repositories {
        google() // ✅ MUST BE FIRST
//        mavenCentral() // ✅ Use instead of jcenter()
        jcenter()

    }
    dependencies {
        classpath 'com.android.tools.build:gradle:4.1.0'
//        classpath 'com.android.tools.build:gradle:7.2.2' //Upgrade AGP
//        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.6.21"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath 'com.google.gms:google-services:4.3.3'
//        classpath 'com.google.firebase:firebase-crashlytics-gradle:2.2.1'
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
//        mavenCentral()
        maven { url 'https://jitpack.io' }
        maven { url "https://maven.aliyun.com/repository/jcenter" }
        maven { url "https://repo1.maven.org/maven2/" }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
